name: CI

# Конвеєр СР3: сім кроків, кожен — критерій якості. Локальний еквівалент — tools/ci-local.sh.
on:
  push:
    branches: [ main, 'feature/**', ci-demo ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Отримати код
        uses: actions/checkout@v5

      - name: 1. Установити .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 2. Відновити залежності
        run: dotnet restore

      - name: 3. Перевірка форматування й стандарту
        run: |
          dotnet format --verify-no-changes --no-restore
          bash tools/check-standard.sh

      - name: 4. Складання Release без попереджень
        run: dotnet build -c Release --no-restore -warnaserror

      - name: 5–6. Тести з покриттям і порогом 70 % (домен і прикладний шар)
        run: >
          dotnet test -c Release --no-build
          /p:CollectCoverage=true
          /p:CoverletOutput=${{ github.workspace }}/coverage/
          /p:Threshold=70

      - name: 7. Опублікувати звіт про покриття
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/coverage.cobertura.xml
